services:
  # Backend Service
  - type: web
    name: virtual-assistant-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: virtual-assistant-frontend
          property: url

  # Frontend Service
  - type: web
    name: virtual-assistant-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: virtual-assistant-backend
          property: url

